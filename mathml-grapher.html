<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contents MathML Graphing Calculator</title>
    <script type="text/x-mathjax-config">
        MathJax.Hub.Config({
            MathML: {
                extensions: ["content-mathml.js"]
            }
        });
    </script>
    <script type="text/javascript" async
        src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML">
    </script>
    <script src="https://onu032001.github.io/content-mathml-parser/lib/content-mathml-parser.js"></script>
    <style>
        body {
            width: fit-content;
            min-width: 100vw;
            height: fit-content;
            min-height: 100vh;
            padding: 0px;
            background-color: #90CAF9;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        body, textarea, button {
            font-family: "Pretendard", "Arial", "Helvetica", "NanumGothic", "Noto Sans KR" sans-serif;
        }
        canvas {
            border: 1px solid black;
        }
        .container {
            margin: 20px;
            border-radius: 20px;
            width: 1000px;
            max-width: 1000px;
            background-color: #BBDEFB;
            box-shadow: 3px 5px 10px #1976D2;
            padding: 30px;
            flex-direction: row;
            align-content: center;
            justify-items: center;
        }
        .shadow {
            box-shadow: 3px 5px 10px #90CAF9;
        }
        .container .title {
            margin: 5px 0 15px 0;
            font-weight: 600;
            color: #1976D2;
        }
        .container .content-title {
            margin: 20px 0;
            font-weight: 700;
            color: #1976D2;
        }
        .container .description {
            margin: 15px 0 5px 0;
            color: #2196F3;
        }
        .input-area {
            outline: none;
            padding: 7.5px;
            width: calc(100% - 20px);
            height: 250px;
            transition: border-color 0.25s, border-width 0.25s;
            font-size: 16px;
        }
        .input-area:focus {
            border-color: #2196F3;
        }
        hr {
            height: 4px;
            background-color: #2196F3;
            border: none;
            border-radius: 2px;
        }
        .full-width {
            width: 100%;
        }
        .full-width-element {
            width: 100%;
        }
        .button {
            color: white;
            background-color: #2196F3;
            border-radius: 20px;
            padding: 20px;
            font-weight: 700;
            font-size: 17.5px;
            border: none;
            cursor: pointer;
            transition: background-color 0.25s, transform 0.25s;
        }
        .button:hover {
            background-color: #1976D2;
            transform: translateY(1.5px);
        }
        .container-area {
            border-radius: 15px;
            border: 2.5px solid #90CAF9;
            background-color: #E3F2FD;
        }
        .equation-render {
            width: 100%;
            height: 250px;
            max-width: 100%;
            max-height: 250px;
            padding: 0px;
            overflow: auto;
        }
        .equation-text {
            margin: 0px;
            width: fit-content;
            height: fit-content;
            min-width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }
        .inline-button {
            color: #2196F3;
            background-color: transparent;
            border: none;
            font-size: inherit;
            font-weight: inherit;
            padding: 0;
            cursor: pointer;
        }
        .inline-button:hover {
            color: #1976D2;
        }
    </style>
</head>
<body>
    <header class="container">
        <h1 class="title">Contents MathML Graphing Calculator</h1>
        <p class="description">The graphing calculator.</p>
    </header>
    <section class="container">
        <div class="full-width">
            <h2 class="content-title">Enter Contents MathML</h2>
            <textarea class="input-area container-area shadow" id="mathmlEditorArea" placeholder="Enter Contents MathML expression here..."></textarea>
            <h2 class="content-title">Equation Rendering Result (<button class="inline-button" id="renderEquationButton">Render Equation</button>)</h2>
            <div class="full-width-element equation-render container-area shadow">
                <div class="equation-text" id="equationRenderResult"></div>
            </div>
            <h2 class="content-title">Minimum and Maximum (XMin, XMax, YMin, YMax)</h2>
            <textarea class="input-area container-area shadow" id="axesEditorArea" placeholder="Enter bounds separated by comma (Spaces are not allowed)...">-5,5,-5,5</textarea>
            <h2 class="content-title">Tools</h2>
            <button class="button shadow" id="plotMathMLButton">Draw Graph</button>
        </div>
        <div class="full-width">
            <hr>
            <h2 class="content-title">Coordinate Plane</h2>
            <canvas class="container-area" id="graphingArea" width="960" height="540"></canvas>
        </div>
    </section>
    <script>
        const canvas = document.getElementById("graphingArea");
        const ctx = canvas.getContext("2d");
        ctx.lineWidth = 2;

        const mathmlEditorArea = document.getElementById("mathmlEditorArea");
        const equationRenderResult = document.getElementById("equationRenderResult");

        const axesEditorArea = document.getElementById("axesEditorArea");
        
        const renderEquationButton = document.getElementById("renderEquationButton");
        const plotMathMLButton = document.getElementById("plotMathMLButton");

        const graphConfig = {
            xMin: -5,
            xMax: 5,
            yMin: -5,
            yMax: 5
        };

        const mapRange = (value, min, max, targetMin, targetMax) => targetMin + (value - min) / (max - min) * (targetMax - targetMin);

        const getFact = val => Math.pow(10, Math.floor(Math.log10(Math.abs(val))));
        const optFunc = (val, fact) => val / fact;

        function drawAxes() {
            const optimized = (function() {
                const xFact = getFact(graphConfig.xMax - graphConfig.xMin);
                this.xMin = graphConfig.xMin / xFact;
                this.xMax = graphConfig.xMax / xFact;
                const yFact = getFact(graphConfig.yMax - graphConfig.yMin);
                this.yMin = graphConfig.yMin / yFact;
                this.yMax = graphConfig.yMax / yFact;
                return this;
            })({});
            console.log();
            ctx.strokeStyle = "#BBDEFB";
            let currentValue = Math.ceil(optimized.xMin * 10);
            while (currentValue <= Math.floor(optimized.xMax * 10)) {
                const yLine = mapRange(currentValue / 10, optimized.xMin, optimized.xMax, 0, 960);
                ctx.beginPath();
                ctx.moveTo(yLine, 0);
                ctx.lineTo(yLine, 540);
                ctx.stroke();
                currentValue++;
            }
            currentValue = Math.ceil(optimized.yMin * 10);
            while (currentValue <= Math.floor(optimized.yMax * 10)) {
                const xLine = mapRange(currentValue / 10, optimized.yMin, optimized.yMax, 540, 0);
                ctx.beginPath();
                ctx.moveTo(0, xLine);
                ctx.lineTo(960, xLine);
                ctx.stroke();
                currentValue++;
            }
            ctx.strokeStyle = "#90CAF9";
            currentValue = Math.ceil(optimized.xMin);
            while (currentValue <= Math.floor(optimized.xMax)) {
                const yLine = mapRange(currentValue, optimized.xMin, optimized.xMax, 0, 960);
                ctx.beginPath();
                ctx.moveTo(yLine, 0);
                ctx.lineTo(yLine, 540);
                ctx.stroke();
                currentValue++;
            }
            currentValue = Math.ceil(optimized.yMin);
            while (currentValue <= Math.floor(optimized.yMax)) {
                const xLine = mapRange(currentValue, optimized.yMin, optimized.yMax, 540, 0);
                ctx.beginPath();
                ctx.moveTo(0, xLine);
                ctx.lineTo(960, xLine);
                ctx.stroke();
                currentValue++;
            }
            ctx.strokeStyle = "black";
            if (optimized.yMin < 0 && optimized.yMax > 0) {
                const xLine = optimized.yMax / (optimized.yMax - optimized.yMin) * 540;
                ctx.beginPath();
                ctx.moveTo(0, xLine);
                ctx.lineTo(960, xLine);
                ctx.stroke();
            }
            if (optimized.xMin < 0 && optimized.xMax > 0) {
                const yLine = -optimized.xMin / (optimized.xMax - optimized.xMin) * 960;
                ctx.beginPath();
                ctx.moveTo(yLine, 0);
                ctx.lineTo(yLine, 540);
                ctx.stroke();
            }
        }

        function plot(func) {
            ctx.clearRect(0, 0, 960, 540);
            drawAxes();
            ctx.strokeStyle = "#2196F3";
            let currentValue = graphConfig.xMin;
            let yValue = func(currentValue);
            ctx.beginPath();
            ctx.moveTo(
                mapRange(currentValue, graphConfig.xMin, graphConfig.xMax, 0, 960),
                mapRange(yValue, graphConfig.yMin, graphConfig.yMax, 540, 0)
            );
            while (currentValue < graphConfig.xMax) {
                currentValue += (graphConfig.xMax - graphConfig.xMin) / 1000;
                let yValue = func(currentValue);
                ctx.lineTo(
                    mapRange(currentValue, graphConfig.xMin, graphConfig.xMax, 0, 960),
                    mapRange(yValue, graphConfig.yMin, graphConfig.yMax, 540, 0)
                );
            }
            ctx.stroke();
        }

        function plotMathML(mathmlString) {
            const cmml = cmmlParser.parseFromString(mathmlString);
            plot(x => cmmlParser.calculate(cmml, { x }));
        }

        renderEquationButton.onclick = () => {
            equationRenderResult.innerHTML = mathmlEditorArea.value;
            MathJax.Hub.Queue(["Typeset", MathJax.Hub, equationRenderResult]);
        }

        plotMathMLButton.onclick = () => {
            equationRenderResult.innerHTML = mathmlEditorArea.value;
            MathJax.Hub.Queue(["Typeset", MathJax.Hub, equationRenderResult]);
            [xMin, xMax, yMin, yMax] = axesEditorArea.value.split(',').map(Number);
            Object.assign(graphConfig, { xMin, xMax, yMin, yMax });
            plotMathML(mathmlEditorArea.value);
        }

        drawAxes();
    </script>
</body>
</html>
